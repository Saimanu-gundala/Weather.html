<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather App</title>
<style>
body{font-family:system-ui,sans-serif;max-width:420px;margin:40px auto;padding:0 16px;background:linear-gradient(#60a5fa,#e0f2fe);min-height:100vh}
h1{text-align:center}
form{display:flex;gap:8px}
input{flex:1;padding:12px;font-size:16px;border:0;border-radius:8px}
button{padding:12px 16px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-size:16px}
#out{background:#fff;margin-top:20px;padding:20px;border-radius:12px;text-align:center}
.temp{font-size:48px;font-weight:700}
</style></head><body>
<h1>Weather</h1>
<form id="f"><input id="c" placeholder="Enter city" required><button>Search</button></form>
<div id="out">Search a city to see the weather.</div>
<script>
const out = document.getElementById("out");
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const city = document.getElementById("c").value.trim();
  out.textContent = "Loading...";
  try {
    const g = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(city));
    const gd = await g.json();
    if (!gd.results) { out.textContent = "City not found."; return; }
    const { latitude, longitude, name, country } = gd.results[0];
    const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,wind_speed_10m,relative_humidity_2m`);
    const c = (await w.json()).current;
    out.innerHTML = `<h2>${name}, ${country}</h2><div class="temp">${c.temperature_2m}°C</div><p>Humidity ${c.relative_humidity_2m}% · Wind ${c.wind_speed_10m} km/h</p>`;
  } catch (err) { out.textContent = "Something went wrong. Try again."; }
};
</script></body></html>
